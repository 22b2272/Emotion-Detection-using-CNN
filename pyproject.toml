[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fer2013-emotion"
version = "0.1.0"
description = "Reproducible FER-2013 facial-expression classification experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.15",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.scripts]
fer2013-emotion = "fer2013_emotion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
